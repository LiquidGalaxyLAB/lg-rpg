<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Zombie Raid RPG</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #1a1a1a;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            overflow: hidden;
        }

        #game-container {
            width: 1080px;
            height: 1920px;
            transform: scale(0.3);
            transform-origin: center center;

            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.8);
        }

        #game-container canvas {
            width: 100% !important;
            height: 100% !important;
        }
    </style>
    <!-- <script src="https://cdn.jsdelivr.net/npm/phaser@4.1.0/dist/phaser.min.js"></script> speed -->
    <script src="https://cdn.jsdelivr.net/npm/phaser@4.1.0/dist/phaser.js"></script>
</head>

<body>

    <div id="game-container"></div>
    <script src="/socket.io/socket.io.js"></script>
    <script type="module" src="game_logic.js"></script>

</body>

</html>
