name: Flutter CI
on:
  push:
    branches:
      - main
  workflow_dispatch:

  pull_request:
    branches:
      - main

jobs:
  flutter_ci:
    name: Run Flutter CI
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: lg_rpg_controller
    steps:
      - uses: actions/checkout@v6
      - uses: subosito/flutter-action@v2
        with:
          channel: "stable"
      - run: flutter pub get
      - name: Verify formatting
        run: dart format --output=none --set-exit-if-changed .
      - run: flutter analyze
      - run: flutter test
